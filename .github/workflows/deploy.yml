name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-vball-tracker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Must run BEFORE Tailscale — restarting Docker recreates iptables chains,
      # which would clobber Tailscale's netfilter rules if Tailscale joined first.
      - name: Configure insecure registry
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
        run: |
          echo "{\"insecure-registries\":[\"${TAILSCALE_IP}:5000\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          timeout 30 bash -c 'until docker info &>/dev/null; do sleep 1; done'

      # Joins tailnet after Docker is settled so Tailscale's iptables rules aren't overwritten.
      - name: Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update && sudo apt-get install -y tailscale
          sudo -E tailscale up --authkey="$TAILSCALE_AUTH_KEY" --advertise-tags=tag:ci --accept-routes --timeout=30s

      - name: Write .npmrc for Verdaccio
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
        run: |
          echo "@keg:registry=http://${TAILSCALE_IP}:4873" > .npmrc
          echo "//${TAILSCALE_IP}:4873/:_authToken=verdaccio-anonymous" >> .npmrc

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with:
          buildkitd-config-inline: |
            [registry."${{ secrets.TAILSCALE_IP }}:5000"]
              http = true
              insecure = true

      - name: Login to Zot registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ secrets.TAILSCALE_IP }}:5000
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push vball-tracker
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7
        with:
          context: .
          push: true
          build-args: VERDACCIO_URL=http://${{ secrets.TAILSCALE_IP }}:4873
          tags: |
            ${{ secrets.TAILSCALE_IP }}:5000/vball-tracker:latest
            ${{ secrets.TAILSCALE_IP }}:5000/vball-tracker:${{ github.sha }}

      - name: Deploy on Jonas
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
          JONAS_SSH_PRIVATE_KEY: ${{ secrets.JONAS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${JONAS_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 "root@${TAILSCALE_IP}" \
            "docker pull ${TAILSCALE_IP}:5000/vball-tracker:latest && \
             docker stop vball-tracker 2>/dev/null || true && \
             docker rm -f vball-tracker 2>/dev/null || true && \
             timeout 30 sh -c 'until ! docker ps -a --format \"{{.Names}}\" | grep -qx vball-tracker; do sleep 1; done' && \
             docker run -d --name vball-tracker --restart unless-stopped \
               -p 3000:3000 \
               -v /mnt/user/appdata/vball-tracker:/data \
               --env-file /mnt/user/appdata/vball-tracker/.env \
               ${TAILSCALE_IP}:5000/vball-tracker:latest"

      - name: Install @keg/discord
        env:
          TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}
        run: |
          mkdir -p /tmp/keg-discord
          echo '{"type":"module"}' > /tmp/keg-discord/package.json
          printf '@keg:registry=http://%s:4873\n//%s:4873/:_authToken=verdaccio-anonymous\n' \
            "$TAILSCALE_IP" "$TAILSCALE_IP" > /tmp/keg-discord/.npmrc
          cd /tmp/keg-discord && npm install @keg/discord --silent

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVICE: vball-tracker
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > /tmp/notify.mjs << 'EOF'
          import { sendWebhook, deploySuccess, deployFailure } from '/tmp/keg-discord/node_modules/@keg/discord/dist/index.js';
          const { DISCORD_WEBHOOK_URL, SHA, RUN_URL, SERVICE, JOB_STATUS } = process.env;
          const payload = JOB_STATUS === 'success'
            ? deploySuccess({ service: SERVICE, sha: SHA, runUrl: RUN_URL })
            : deployFailure({ service: SERVICE, sha: SHA, runUrl: RUN_URL });
          await sendWebhook(DISCORD_WEBHOOK_URL, payload);
          EOF
          node /tmp/notify.mjs
